[project]
name = "prime-agent-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Prime Agent recursion"
requires-python = ">=3.10"
dependencies = [
  "ipykernel",
  "nest-asyncio",
  "tyro",
]

[dependency-groups]
dev = [
  "httpx",
  "mcp>=1.0",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
