name: Release Prime Agent

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Production release tag to create if absent, or verify if it already exists (e.g., v0.0.1)'
        required: true
        type: string

concurrency:
  group: release-prime-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      beta_version: ${{ steps.context.outputs.beta_version }}
      source_sha: ${{ steps.context.outputs.source_sha }}
      production_version: ${{ steps.context.outputs.production_version }}
      publish_beta: ${{ steps.context.outputs.publish_beta }}
      publish_production: ${{ steps.context.outputs.publish_production }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release context
        id: context
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # This emits exactly one LF-terminated plain-semver line, and rejects
          # missing, duplicate, multiline, or non-canonical package versions before
          # any release value can be derived or written to GITHUB_OUTPUT.
          package_version=$(node scripts/read-release-version.mjs package.json)
          beta_version=
          source_sha=
          production_version=
          publish_beta=false
          publish_production=false

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "Manual releases must run from the default branch (${DEFAULT_BRANCH}), not ${REF_NAME}." >&2
              exit 1
            fi
            if ! printf '%s\n' "$INPUT_RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "release_tag must be a production tag like v0.0.1." >&2
              exit 1
            fi
            source_sha=$(git rev-parse "${GITHUB_SHA_VALUE}^{commit}")
            if git show-ref --verify --quiet "refs/tags/$INPUT_RELEASE_TAG"; then
              tagged_commit=$(git rev-parse "refs/tags/$INPUT_RELEASE_TAG^{commit}")
              if [ "$tagged_commit" != "$source_sha" ]; then
                echo "Manual release tag $INPUT_RELEASE_TAG resolves to $tagged_commit, not the selected immutable default-branch commit $source_sha." >&2
                exit 1
              fi
              echo "Retrying immutable production tag $INPUT_RELEASE_TAG for $source_sha."
            else
              echo "Manual release will create immutable production tag $INPUT_RELEASE_TAG for $source_sha."
            fi
            production_version="${INPUT_RELEASE_TAG#v}"
            if [ "$production_version" != "$package_version" ]; then
              echo "Manual release tag $INPUT_RELEASE_TAG is incompatible with package.json version $package_version." >&2
              exit 1
            fi
            publish_production=true
          elif [ "$REF_TYPE" = tag ]; then
            if ! printf '%s\n' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Production tag must be plain semver like v0.0.1: $REF_NAME" >&2
              exit 1
            fi
            source_sha=$(git rev-parse "refs/tags/$REF_NAME^{commit}")
            event_commit=$(git rev-parse "${GITHUB_SHA_VALUE}^{commit}")
            if [ "$source_sha" != "$event_commit" ]; then
              echo "Tag $REF_NAME peels to $source_sha, not event commit $event_commit." >&2
              exit 1
            fi
            production_version="${REF_NAME#v}"
            if [ "$production_version" != "$package_version" ]; then
              echo "Production tag $REF_NAME is incompatible with package.json version $package_version." >&2
              exit 1
            fi
            publish_production=true
          else
            production_version="$package_version"
            source_sha="$GITHUB_SHA_VALUE"
            beta_version="${production_version}-beta.${RUN_NUMBER}.${RUN_ATTEMPT}.${GITHUB_SHA_VALUE::7}"
            publish_beta=true

            previous_version=
            if [ -n "$BEFORE_SHA" ] && ! printf '%s\n' "$BEFORE_SHA" | grep -Eq '^0+$' && git cat-file -e "${BEFORE_SHA}:package.json"; then
              git show "${BEFORE_SHA}:package.json" > /tmp/previous-package.json
              previous_version=$(node scripts/read-release-version.mjs /tmp/previous-package.json)
            fi

            if [ -z "$previous_version" ] || [ "$production_version" != "$previous_version" ]; then
              if git show-ref --verify --quiet "refs/tags/v${production_version}"; then
                tagged_commit=$(git rev-parse "refs/tags/v${production_version}^{commit}")
                if [ "$tagged_commit" != "$source_sha" ]; then
                  echo "Production v${production_version} already points to ${tagged_commit}, not ${source_sha}." >&2
                  exit 1
                fi
                echo "Retrying production v${production_version} for ${source_sha}."
              fi
              publish_production=true
            elif ! git show-ref --verify --quiet "refs/tags/v${production_version}"; then
              echo "Production v${production_version} has no tag; retrying the failed release."
              publish_production=true
            else
              echo "Package version is unchanged at ${production_version}; only beta will advance."
            fi
          fi

          if [ "$publish_production" = true ] && ! printf '%s\n' "$production_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Production version must be plain semver like 0.0.1: ${production_version}" >&2
            exit 1
          fi

          echo "beta_version=$beta_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "production_version=$production_version" >> "$GITHUB_OUTPUT"
          echo "publish_beta=$publish_beta" >> "$GITHUB_OUTPUT"
          echo "publish_production=$publish_production" >> "$GITHUB_OUTPUT"
          echo "Source SHA: $source_sha"
          echo "Production: $publish_production ${production_version:+v${production_version}}"
          echo "Beta: $publish_beta ${beta_version:+v${beta_version}}"

  build:
    runs-on: ubuntu-latest
    needs: release-context
    outputs:
      source_commit: ${{ steps.source-commit.outputs.commit }}
    permissions:
      contents: read
    env:
      BETA_VERSION: ${{ needs.release-context.outputs.beta_version }}
      SOURCE_SHA: ${{ needs.release-context.outputs.source_sha }}
      PRODUCTION_VERSION: ${{ needs.release-context.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-context.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-context.outputs.publish_production }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      # The checkout is the immutable source identity. Remove every ignored and
      # untracked byte before dependencies or build products exist, so a runner
      # workspace cannot supply package inputs while artifacts claim SOURCE_SHA.
      - name: Clean immutable source checkout
        run: git clean -ffdx

      - name: Verify immutable source checkout
        id: source-commit
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "commit=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      # Packer input is now exactly tracked HEAD plus these freshly built dist
      # roots. Do not let installed dependencies or check byproducts coexist with
      # the release packer, which rejects every other untracked/ignored path.
      - name: Remove non-release build inputs
        run: |
          git clean -ffdx \
            -e /packages/agent/dist/ \
            -e /packages/ai/dist/ \
            -e /packages/tui/dist/ \
            -e /packages/coding-agent/dist/

      - name: Pack production release
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          PRIME_AGENT_DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          test -n "$PRIME_AGENT_DOWNLOAD_BASE_URL"
          npm run release:pack -- \
            --channel stable \
            --version "$PRODUCTION_VERSION" \
            --commit "$SOURCE_SHA" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --out-dir packages/coding-agent/release/production
          npm run release:verify -- \
            --artifact-dir packages/coding-agent/release/production/artifacts \
            --channel stable \
            --version "$PRODUCTION_VERSION" \
            --commit "$SOURCE_SHA" \
            --dry-run

      - name: Pack beta release
        if: env.PUBLISH_BETA == 'true'
        env:
          PRIME_AGENT_DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          test -n "$PRIME_AGENT_DOWNLOAD_BASE_URL"
          npm run release:pack -- \
            --channel beta \
            --version "$BETA_VERSION" \
            --commit "$SOURCE_SHA" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --out-dir packages/coding-agent/release/beta
          npm run release:verify -- \
            --artifact-dir packages/coding-agent/release/beta/artifacts \
            --channel beta \
            --version "$BETA_VERSION" \
            --commit "$SOURCE_SHA" \
            --dry-run

      - name: Upload production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prime-agent-production
          path: packages/coding-agent/release/production/artifacts/*
          if-no-files-found: error

      - name: Upload beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prime-agent-beta
          path: packages/coding-agent/release/beta/artifacts/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [release-context, build]
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      BETA_VERSION: ${{ needs.release-context.outputs.beta_version }}
      SOURCE_SHA: ${{ needs.release-context.outputs.source_sha }}
      SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
      PRODUCTION_VERSION: ${{ needs.release-context.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-context.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-context.outputs.publish_production }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/download-artifact@v8
        with:
          name: prime-agent-production
          path: release-artifacts/production

      - name: Download beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/download-artifact@v8
        with:
          name: prime-agent-beta
          path: release-artifacts/beta

      - name: Confirm immutable publication checkout matches packed source
        run: |
          test "$SOURCE_COMMIT" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      # Production tags are protected immutable release identities. This workflow never
      # moves one: an existing tag must peel to SOURCE_SHA and a missing tag is created
      # exactly once using GitHub's non-force ref API.
      - name: Create or verify immutable production tag
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${PRODUCTION_VERSION}"
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Using existing protected release tag $RELEASE_TAG."
          elif ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$SOURCE_SHA" >/dev/null; then
            # A competing creator is safe only if the recheck below finds the exact
            # immutable source commit. Any other API failure still fails at recheck.
            echo "Release-tag creation raced; verifying the existing protected tag."
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$tagged_sha" != "$SOURCE_SHA" ]; then
            echo "Protected release tag $RELEASE_TAG peels to $tagged_sha, not $SOURCE_SHA." >&2
            exit 1
          fi

      - name: Prepare installer
        run: |
          INSTALL_BASE_URL="${R2_PUBLIC_BASE_URL%/}"
          export INSTALL_BASE_URL
          test -n "$INSTALL_BASE_URL"

          node - <<'NODE'
          const fs = require("node:fs");
          const baseUrl = process.env.INSTALL_BASE_URL;
          if (!baseUrl) throw new Error("INSTALL_BASE_URL is required");
          const installer = fs.readFileSync("install.sh", "utf8");
          const renderInstaller = (channel) => installer
            .replaceAll("__PRIME_AGENT_DOWNLOAD_BASE_URL__", baseUrl)
            .replaceAll("__PRIME_AGENT_DEFAULT_RELEASE_CHANNEL__", channel);
          fs.writeFileSync("/tmp/prime-agent-install.sh", renderInstaller("stable"));
          fs.writeFileSync("/tmp/prime-agent-install-beta.sh", renderInstaller("beta"));
          NODE

      # Immutable release objects are write-once. A conditional PUT wins only
      # when absent; every error path is treated as a possible collision and is
      # accepted solely after downloading and hashing the existing object.
      - name: Prepare immutable publication helpers
        run: |
          cat > /tmp/release-publication-helpers.sh <<'SH'
          create_or_verify_immutable_r2_object() {
            local_file="$1"
            object_key="$2"
            content_type="$3"
            test -f "$local_file"
            expected_sha=$(sha256sum "$local_file" | awk '{print $1}')
            remote_uri="s3://${R2_BUCKET}/${object_key}"

            if aws s3api put-object \
                --bucket "$R2_BUCKET" \
                --key "$object_key" \
                --body "$local_file" \
                --if-none-match '*' \
                --content-type "$content_type" \
                --cache-control 'public, max-age=31536000, immutable' \
                --metadata "sha256=$expected_sha" \
                --endpoint-url "$R2_ENDPOINT_URL" >/dev/null; then
              echo "Created immutable object ${remote_uri} (${expected_sha})."
              return 0
            fi

            collision_file=$(mktemp)
            trap 'rm -f "$collision_file"' RETURN
            aws s3api get-object \
              --bucket "$R2_BUCKET" \
              --key "$object_key" \
              --endpoint-url "$R2_ENDPOINT_URL" \
              "$collision_file" >/dev/null
            actual_sha=$(sha256sum "$collision_file" | awk '{print $1}')
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "Immutable object collision at ${remote_uri}: expected ${expected_sha}, found ${actual_sha}." >&2
              return 1
            fi
            echo "Verified existing immutable object ${remote_uri} (${expected_sha})."
          }

          attach_or_verify_immutable_release_asset() {
            release_tag="$1"
            local_file="$2"
            asset_name=$(basename "$local_file")
            expected_sha=$(sha256sum "$local_file" | awk '{print $1}')
            release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq .id)
            asset_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate \
              --jq ".[] | select(.name == \"${asset_name}\") | .id" | head -n 1 || true)
            if [ -z "$asset_id" ]; then
              # Never clobber: a concurrent uploader is verified below instead.
              gh release upload "$release_tag" "$local_file" || true
              asset_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate \
                --jq ".[] | select(.name == \"${asset_name}\") | .id" | head -n 1 || true)
            fi
            if [ -z "$asset_id" ]; then
              echo "Release asset ${asset_name} was not created." >&2
              return 1
            fi
            collision_file=$(mktemp)
            trap 'rm -f "$collision_file"' RETURN
            gh api --header 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$collision_file"
            actual_sha=$(sha256sum "$collision_file" | awk '{print $1}')
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "Immutable release asset collision for ${release_tag}/${asset_name}: expected ${expected_sha}, found ${actual_sha}." >&2
              return 1
            fi
            echo "Verified release asset ${release_tag}/${asset_name} (${expected_sha})."
          }
          SH

      - name: Extract production release notes
        if: env.PUBLISH_PRODUCTION == 'true'
        run: |
          awk "/^## \[${PRODUCTION_VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" packages/coding-agent/CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release v${PRODUCTION_VERSION}" > /tmp/release-notes.md
          fi

      - name: Publish immutable production artifacts to R2
        if: env.PUBLISH_PRODUCTION == 'true'
        run: |
          . /tmp/release-publication-helpers.sh
          PRODUCTION_DIR=release-artifacts/production
          RELEASE_PREFIX="releases/v${PRODUCTION_VERSION}"

          npm run release:verify -- \
            --artifact-dir "$PRODUCTION_DIR" \
            --channel stable \
            --version "$PRODUCTION_VERSION" \
            --commit "$SOURCE_COMMIT" \
            --dry-run
          test -f "$PRODUCTION_DIR/prime-agent-${PRODUCTION_VERSION}.tgz"
          test -f "$PRODUCTION_DIR/manifest.json"
          test -f "$PRODUCTION_DIR/SHA256SUMS"
          test -f "$PRODUCTION_DIR/latest.json"
          test -n "$R2_BUCKET"
          test -n "$R2_ENDPOINT_URL"

          # The versioned prefix contains canonical, immutable release evidence.
          # latest.json remains a mutable root pointer and is never versioned here.
          for artifact in "$PRODUCTION_DIR"/*.tgz; do
            create_or_verify_immutable_r2_object "$artifact" "$RELEASE_PREFIX/$(basename "$artifact")" application/gzip
          done
          create_or_verify_immutable_r2_object "$PRODUCTION_DIR/manifest.json" "$RELEASE_PREFIX/manifest.json" application/json
          create_or_verify_immutable_r2_object "$PRODUCTION_DIR/SHA256SUMS" "$RELEASE_PREFIX/SHA256SUMS" text/plain

      - name: Create or verify immutable production GitHub release and assets
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . /tmp/release-publication-helpers.sh
          RELEASE_TAG="v${PRODUCTION_VERSION}"
          PRODUCTION_DIR=release-artifacts/production
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$tagged_sha" != "$SOURCE_SHA" ]; then
            echo "Protected release tag $RELEASE_TAG peels to $tagged_sha, not $SOURCE_SHA." >&2
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A losing concurrent creator is acceptable only when the tag-bound
            # release becomes visible and each asset verifies below.
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --target "$SOURCE_SHA" \
              --notes-file /tmp/release-notes.md || true
          fi
          gh release view "$RELEASE_TAG" >/dev/null
          # GitHub assets mirror the versioned canonical evidence, never a mutable
          # channel pointer. Clients resolve latest.json only from the R2 root.
          for artifact in "$PRODUCTION_DIR"/*.tgz "$PRODUCTION_DIR/manifest.json" "$PRODUCTION_DIR/SHA256SUMS"; do
            attach_or_verify_immutable_release_asset "$RELEASE_TAG" "$artifact"
          done
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$tagged_sha" != "$SOURCE_SHA" ]; then
            echo "Protected release tag $RELEASE_TAG changed during release publication." >&2
            exit 1
          fi

      - name: Advance production root pointers after immutable release publication
        if: env.PUBLISH_PRODUCTION == 'true'
        run: |
          PRODUCTION_DIR=release-artifacts/production
          RELEASE_TAG="v${PRODUCTION_VERSION}"
          # Re-fetch at the stable-pointer boundary so a moved/replaced remote tag can
          # never publish stable after another release identity took its place.
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$tagged_sha" != "$SOURCE_SHA" ]; then
            echo "Protected release tag $RELEASE_TAG peels to $tagged_sha, not $SOURCE_SHA." >&2
            exit 1
          fi
          aws s3 cp "$PRODUCTION_DIR/latest.json" "s3://${R2_BUCKET}/latest.json" \
            --endpoint-url "$R2_ENDPOINT_URL" --content-type application/json --cache-control no-cache
          aws s3 cp /tmp/prime-agent-install.sh "s3://${R2_BUCKET}/install.sh" \
            --endpoint-url "$R2_ENDPOINT_URL" --content-type text/x-shellscript --cache-control no-cache
          aws s3 cp /tmp/prime-agent-install-beta.sh "s3://${R2_BUCKET}/install-beta.sh" \
            --endpoint-url "$R2_ENDPOINT_URL" --content-type text/x-shellscript --cache-control no-cache
          # stable is the final mutable commitment, after tag, immutable R2, release,
          # assets, and all other root documents are durably available.
          aws s3 cp "$PRODUCTION_DIR/stable" "s3://${R2_BUCKET}/stable" \
            --endpoint-url "$R2_ENDPOINT_URL" --content-type text/plain --cache-control no-cache

      # Unlike the moving beta convenience ref, each beta build has a unique,
      # immutable tag and release identity. The mutable beta root pointers advance
      # only after the same create-or-verify publication sequence completes.
      - name: Create or verify immutable beta tag
        if: env.PUBLISH_BETA == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${BETA_VERSION}"
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Using existing immutable beta tag $RELEASE_TAG."
          elif ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$SOURCE_SHA" >/dev/null; then
            echo "Beta-tag creation raced; verifying the existing immutable tag."
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$tagged_sha" != "$SOURCE_SHA" ]; then
            echo "Immutable beta tag $RELEASE_TAG peels to $tagged_sha, not $SOURCE_SHA." >&2
            exit 1
          fi

      - name: Publish immutable beta artifacts to R2
        if: env.PUBLISH_BETA == 'true'
        run: |
          . /tmp/release-publication-helpers.sh
          BETA_DIR=release-artifacts/beta
          RELEASE_PREFIX="releases/v${BETA_VERSION}"

          npm run release:verify -- \
            --artifact-dir "$BETA_DIR" \
            --channel beta \
            --version "$BETA_VERSION" \
            --commit "$SOURCE_COMMIT" \
            --dry-run
          test -f "$BETA_DIR/prime-agent-${BETA_VERSION}.tgz"
          test -f "$BETA_DIR/manifest.json"
          test -f "$BETA_DIR/SHA256SUMS"
          test -f "$BETA_DIR/beta.json"
          test -n "$R2_BUCKET"
          test -n "$R2_ENDPOINT_URL"
          for artifact in "$BETA_DIR"/*.tgz; do
            create_or_verify_immutable_r2_object "$artifact" "$RELEASE_PREFIX/$(basename "$artifact")" application/gzip
          done
          create_or_verify_immutable_r2_object "$BETA_DIR/manifest.json" "$RELEASE_PREFIX/manifest.json" application/json
          create_or_verify_immutable_r2_object "$BETA_DIR/SHA256SUMS" "$RELEASE_PREFIX/SHA256SUMS" text/plain

      - name: Create or verify immutable beta GitHub release and assets
        if: env.PUBLISH_BETA == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . /tmp/release-publication-helpers.sh
          RELEASE_TAG="v${BETA_VERSION}"
          BETA_DIR=release-artifacts/beta
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$tagged_sha" = "$SOURCE_SHA"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --target "$SOURCE_SHA" \
              --notes "Automated immutable beta build from ${SOURCE_SHA}." \
              --prerelease || true
          fi
          gh release view "$RELEASE_TAG" >/dev/null
          # GitHub assets mirror the versioned canonical evidence, never a mutable
          # channel pointer. Clients resolve beta.json only from the R2 root.
          for artifact in "$BETA_DIR"/*.tgz "$BETA_DIR/manifest.json" "$BETA_DIR/SHA256SUMS"; do
            attach_or_verify_immutable_release_asset "$RELEASE_TAG" "$artifact"
          done
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$tagged_sha" = "$SOURCE_SHA"

      - name: Advance beta root pointers after immutable release publication
        if: env.PUBLISH_BETA == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Do not allow an older build to move any mutable beta root pointer.
          encoded_default_branch=$(node scripts/encode-github-api-path-segment.mjs "$DEFAULT_BRANCH")
          latest_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_default_branch}" --jq .sha)
          if [ "$latest_main_sha" != "$SOURCE_SHA" ]; then
            echo "A newer main commit exists; keeping its beta pointers in place."
            exit 0
          fi
          BETA_DIR=release-artifacts/beta
          aws s3 cp "$BETA_DIR/beta.json" "s3://${R2_BUCKET}/beta.json" \
            --endpoint-url "$R2_ENDPOINT_URL" --content-type application/json --cache-control no-cache
          aws s3 cp /tmp/prime-agent-install.sh "s3://${R2_BUCKET}/install.sh" \
            --endpoint-url "$R2_ENDPOINT_URL" --content-type text/x-shellscript --cache-control no-cache
          aws s3 cp /tmp/prime-agent-install-beta.sh "s3://${R2_BUCKET}/install-beta.sh" \
            --endpoint-url "$R2_ENDPOINT_URL" --content-type text/x-shellscript --cache-control no-cache
          aws s3 cp "$BETA_DIR/beta" "s3://${R2_BUCKET}/beta" \
            --endpoint-url "$R2_ENDPOINT_URL" --content-type text/plain --cache-control no-cache
